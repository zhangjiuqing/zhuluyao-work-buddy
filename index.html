<style>
/* ============ 星露谷·宝工作台 ============ */
:root{
  --wood-dark:#5c3a1e;
  --wood:#8b5a2b;
  --wood-light:#a9714b;
  --parch:#fff6e0;
  --parch-2:#f4e4c1;
  --parch-3:#ecd6ac;
  --ink:#4a2f18;
  --ink-soft:#7a5a3a;
  --green:#7cb342;
  --green-dark:#5a8f2c;
  --sky:#62b6e8;
  --gold:#f2b632;
  --rose:#e0798f;
  --red:#d1533f;
  --purple:#9b7bd4;
  --sd:0 3px 0 rgba(74,47,24,.35);
  --sidebar-w:150px;
  --sidebar-cw:58px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","微软雅黑","MS YaHei",-apple-system,"PingFang SC","Heiti SC",sans-serif;
  color:var(--ink);
  background:#e9d9b6;
  background-image:
    radial-gradient(circle at 18% 12%,rgba(255,255,255,.55) 0 2px,transparent 3px),
    radial-gradient(circle at 74% 30%,rgba(255,255,255,.4) 0 2px,transparent 3px),
    radial-gradient(circle at 40% 78%,rgba(255,255,255,.4) 0 2px,transparent 3px),
    linear-gradient(160deg,#f0e0bd 0%,#e3cfa4 100%);
  overflow:hidden;
  font-size:14px;
  line-height:1.6;
}
button,input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(139,90,43,.10)}
::-webkit-scrollbar-thumb{background:var(--wood-light);border:2px solid transparent;background-clip:padding-box;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--wood)}

/* 像素面板 */
.px{
  background:var(--parch);
  border:3px solid var(--wood);
  box-shadow:0 0 0 3px var(--parch-2),0 4px 0 3px rgba(92,58,30,.28);
  border-radius:4px;
}
.px-in{
  background:var(--parch-2);
  border:2px solid var(--wood-light);
  border-radius:3px;
}

/* ============ 布局 ============ */
#app{display:flex;height:100%;width:100%;padding-left:var(--safe-l);padding-right:var(--safe-r)}

/* ---- 侧边栏 ---- */
#sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#a9714b 0%,#8b5a2b 60%,#75491f 100%);
  border-right:3px solid var(--wood-dark);
  transition:width .22s ease,flex-basis .22s ease;
  position:relative;z-index:40;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);
}
#sidebar.collapsed{width:var(--sidebar-cw);flex-basis:var(--sidebar-cw)}
.sb-head{
  display:flex;align-items:center;gap:6px;
  padding:9px 8px;border-bottom:2px solid rgba(92,58,30,.55);
  background:rgba(255,246,224,.12);min-height:46px;
}
.sb-logo{width:26px;height:26px;flex:0 0 26px}
.sb-title{
  font-size:12.5px;font-weight:700;color:#fff6e0;white-space:nowrap;overflow:hidden;
  text-shadow:1px 1px 0 rgba(92,58,30,.9);letter-spacing:.3px;
}
#sidebar.collapsed .sb-title{display:none}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0 10px}
.sb-scroll::-webkit-scrollbar{width:5px}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,246,224,.4)}

/* 一级模块：字体略小于二级 */
.l1{margin:8px 0 2px}
.l1-head{
  display:flex;align-items:center;gap:5px;padding:4px 8px;cursor:pointer;user-select:none;
}
.l1-ico{width:20px;height:20px;flex:0 0 20px}
.l1-name{
  font-size:11.5px;font-weight:700;color:#ffe9b8;white-space:nowrap;overflow:hidden;
  text-shadow:1px 1px 0 rgba(92,58,30,.85);letter-spacing:.5px;flex:1;
}
.l1-arrow{font-size:9px;color:#ffe9b8;opacity:.75;transition:transform .2s}
.l1.folded .l1-arrow{transform:rotate(-90deg)}
.l1-line{height:2px;margin:2px 8px 4px;background:repeating-linear-gradient(90deg,rgba(255,233,184,.5) 0 4px,transparent 4px 8px)}
#sidebar.collapsed .l1-name,#sidebar.collapsed .l1-arrow,#sidebar.collapsed .l1-line{display:none}
#sidebar.collapsed .l1-head{justify-content:center;padding:4px 0}
.l1-kids{overflow:hidden;transition:max-height .22s ease;max-height:600px}
.l1.folded .l1-kids{max-height:0}

/* 二级模块 */
.l2{
  display:flex;align-items:center;gap:6px;
  margin:2px 6px;padding:6px 7px;border-radius:4px;cursor:pointer;
  color:#fff6e0;font-size:13.5px;font-weight:600;white-space:nowrap;
  border:2px solid transparent;transition:background .14s,border-color .14s;
}
.l2:hover{background:rgba(255,246,224,.16)}
.l2.active{background:var(--parch);color:var(--ink);border-color:var(--gold);box-shadow:0 2px 0 rgba(92,58,30,.4)}
.l2-ico{width:20px;height:20px;flex:0 0 20px}
.l2-name{overflow:hidden;text-overflow:ellipsis}
#sidebar.collapsed .l2{justify-content:center;padding:7px 0;margin:3px 5px}
#sidebar.collapsed .l2-name{display:none}
.sb-foot{border-top:2px solid rgba(92,58,30,.55);padding:6px;display:flex;flex-direction:column;gap:5px}
.sb-btn{
  display:flex;align-items:center;gap:6px;justify-content:flex-start;
  background:rgba(255,246,224,.15);border:2px solid rgba(255,246,224,.35);color:#fff6e0;
  font-size:12px;font-weight:600;padding:5px 7px;border-radius:4px;cursor:pointer;white-space:nowrap;
}
.sb-btn:hover{background:rgba(255,246,224,.3)}
.sb-btn i{font-style:normal;font-size:13px;width:16px;text-align:center;flex:0 0 16px}
#sidebar.collapsed .sb-btn span{display:none}
#sidebar.collapsed .sb-btn{justify-content:center}

/* ---- 主区 ---- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#topbar{
  display:flex;align-items:center;gap:9px;
  padding:calc(8px + var(--safe-t)) 14px 8px;
  background:linear-gradient(180deg,rgba(255,246,224,.95),rgba(244,228,193,.9));
  border-bottom:3px solid var(--wood);min-height:48px;flex:0 0 auto;
}
.crumb{display:flex;align-items:baseline;gap:6px;min-width:0;flex:1}
.crumb-l1{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.crumb-sep{color:var(--wood-light);font-size:11px}
.crumb-l2{font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 1px 0 rgba(255,255,255,.7)}
.top-date{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;font-weight:600}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px calc(90px + var(--safe-b));position:relative}

/* ============ 通用组件 ============ */
.card{background:var(--parch);border:3px solid var(--wood);border-radius:5px;box-shadow:0 3px 0 rgba(92,58,30,.25);padding:12px 13px;margin-bottom:13px}
.card-t{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:10px;padding-bottom:7px;border-bottom:2px dashed var(--parch-3)}
.card-t .ico{width:22px;height:22px;flex:0 0 22px}
.btn{
  border:2px solid var(--wood);background:linear-gradient(180deg,#fff6e0,#f0dcb4);
  color:var(--ink);font-weight:700;font-size:13px;padding:6px 13px;border-radius:4px;cursor:pointer;
  box-shadow:0 2px 0 rgba(92,58,30,.35);transition:transform .08s,box-shadow .08s;white-space:nowrap;
}
.btn:hover{background:linear-gradient(180deg,#fffaf0,#f6e6c4)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(92,58,30,.35)}
.btn.pri{background:linear-gradient(180deg,#8fc94f,#6ba336);color:#fff;border-color:var(--green-dark);text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.btn.pri:hover{background:linear-gradient(180deg,#9ad35c,#75b13c)}
.btn.warn{background:linear-gradient(180deg,#e8735f,#c9432f);color:#fff;border-color:#a3341f;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.btn.sky{background:linear-gradient(180deg,#7cc6f0,#4fa3d8);color:#fff;border-color:#3d84b3;text-shadow:1px 1px 0 rgba(0,0,0,.2)}
.btn.sm{font-size:11.5px;padding:4px 9px}
.btn.mini{font-size:11px;padding:2px 7px;box-shadow:0 1px 0 rgba(92,58,30,.35)}
.inp,.ta,.sel{
  border:2px solid var(--wood-light);background:#fffdf5;border-radius:4px;
  padding:7px 9px;font-size:13.5px;outline:none;width:100%;
}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,182,50,.25)}
.ta{resize:vertical;min-height:70px;line-height:1.65}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:120px}
.muted{color:var(--ink-soft);font-size:12px}
.empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:13px}
.empty .big{font-size:34px;display:block;margin-bottom:6px;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--parch-2);border:2px solid var(--wood-light);border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:700}
.tagbtn{border:2px solid var(--wood-light);background:var(--parch-2);border-radius:14px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.tagbtn.on{background:linear-gradient(180deg,#8fc94f,#6ba336);color:#fff;border-color:var(--green-dark)}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.divider{height:2px;background:repeating-linear-gradient(90deg,var(--parch-3) 0 6px,transparent 6px 12px);margin:11px 0}

/* 折叠历史 */
.fold{border:2px solid var(--wood-light);border-radius:4px;margin-bottom:8px;background:var(--parch-2);overflow:hidden}
.fold-h{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:13px;background:linear-gradient(180deg,rgba(255,246,224,.8),rgba(236,214,172,.7))}
.fold-h:hover{background:linear-gradient(180deg,#fffaf0,#f0dcb4)}
.fold-h .ar{margin-left:auto;font-size:10px;transition:transform .2s;color:var(--ink-soft)}
.fold.open .fold-h .ar{transform:rotate(90deg)}
.fold-b{display:none;padding:9px 10px;background:var(--parch);border-top:2px solid var(--parch-3)}
.fold.open .fold-b{display:block}

/* 任务卡片 */
.task{
  display:flex;align-items:center;gap:9px;background:#fffdf5;border:2px solid var(--wood-light);
  border-radius:5px;padding:9px 10px;margin-bottom:7px;box-shadow:0 2px 0 rgba(92,58,30,.16);
  transition:background .15s,opacity .15s;
}
.task.done{background:#edf7e2;border-color:var(--green)}
.task.done .task-txt{text-decoration:line-through;color:#87a06a}
.cb{
  width:24px;height:24px;flex:0 0 24px;border:2px solid var(--wood);border-radius:4px;background:#fffdf5;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
}
.cb.on{background:linear-gradient(180deg,#8fc94f,#6ba336);border-color:var(--green-dark)}
.cb svg{width:16px;height:16px;display:none}
.cb.on svg{display:block}
.task-txt{flex:1;font-size:13.5px;font-weight:600;word-break:break-word;min-width:0}
.del{
  width:24px;height:24px;flex:0 0 24px;border:2px solid #b8442f;background:linear-gradient(180deg,#e8735f,#c9432f);
  color:#fff;border-radius:4px;cursor:pointer;font-size:13px;font-weight:900;line-height:1;padding:0;
}
.del:hover{filter:brightness(1.1)}

/* 缩略图 */
.thumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.thumb{position:relative;width:78px;height:78px;border:2px solid var(--wood);border-radius:4px;overflow:hidden;background:var(--parch-3)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:1px;right:1px;width:18px;height:18px;border:none;background:rgba(201,67,47,.92);color:#fff;font-size:11px;font-weight:900;border-radius:3px;cursor:pointer;line-height:1;padding:0}
.audios{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.aud{display:flex;align-items:center;gap:7px;background:var(--parch-2);border:2px solid var(--wood-light);border-radius:4px;padding:5px 7px}
.aud audio{height:30px;flex:1;min-width:0}

/* 录音按钮 */
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(40,24,10,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.modal{background:var(--parch);border:3px solid var(--wood);border-radius:6px;box-shadow:0 0 0 3px var(--parch-2),0 10px 26px rgba(0,0,0,.35);max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:15px 16px}
.modal h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:7px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#lightbox{position:fixed;inset:0;background:rgba(20,12,4,.9);z-index:300;display:none;align-items:center;justify-content:center;padding:18px}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:100%;border:3px solid var(--parch-2);border-radius:4px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));z-index:400;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.tst{background:var(--parch);border:3px solid var(--wood);border-radius:5px;padding:8px 15px;font-size:13px;font-weight:700;box-shadow:0 4px 0 rgba(92,58,30,.3);animation:pop .25s}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* 装饰 */
.deco{position:absolute;pointer-events:none;opacity:.5;z-index:0}
#content>*{position:relative;z-index:1}

/* 海莉 */
#haley{position:fixed;right:14px;bottom:calc(14px + var(--safe-b));z-index:150;width:78px;cursor:grab;touch-action:none;user-select:none}
#haley.drag{cursor:grabbing}
#haley .body{filter:drop-shadow(0 3px 4px rgba(60,36,16,.35));animation:bob 2.6s ease-in-out infinite,blink-haley 5.2s ease-in-out infinite;width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:-moz-crisp-edges}
@keyframes blink-haley{0%,92%,96%,100%{opacity:1}94%,95%{opacity:.25}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#bubble{
  position:absolute;bottom:calc(100% + 8px);right:0;min-width:150px;max-width:230px;
  background:var(--parch);border:3px solid var(--wood);border-radius:7px;padding:8px 10px;
  font-size:12.5px;font-weight:600;line-height:1.55;box-shadow:0 3px 0 rgba(92,58,30,.3);display:none;
}
#bubble.show{display:block;animation:pop .22s}
#bubble:after{content:"";position:absolute;bottom:-9px;right:24px;width:0;height:0;border:8px solid transparent;border-top-color:var(--wood)}
#bubble .nm{color:var(--rose);font-weight:800;font-size:11.5px;display:block;margin-bottom:2px}

/* 移动端遮罩 */
#sbmask{display:none;position:fixed;inset:0;background:rgba(40,24,10,.5);z-index:35}
#sbmask.show{display:block}
#mobtn{display:none}

/* 图表 */
.chartbox{width:100%;overflow-x:auto}
.chartbox svg{display:block}

/* ============ 移动端 ============ */
@media (max-width:820px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .24s ease;width:172px;flex-basis:172px;box-shadow:4px 0 14px rgba(0,0,0,.3)}
  #sidebar.mo{transform:none}

const nowT = ()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WK = ['周日','周一','周二','周三','周四','周五','周六'];
function dLabel(ds){
  const d=new Date(ds+'T00:00:00'); const t=today();

}

function drawPx(rows,pal){
  let out='';
  for(let y=0;y<rows.length;y++){
    const r=rows[y]; let x=0;
    while(x<r.length){
      const c=r[x];
      if(!pal[c]){x++;continue;}
      let w=1; while(x+w<r.length && r[x+w]===c) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+pal[c]+'"/>';
      x+=w;
    }
  }
  return out;
}

  const w=def.rows[0].length,h=def.rows.length;
  return '<svg class="'+(cls||'')+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges">'+drawPx(def.rows,def.pal)+'</svg>';

function ico(name,cls){ return ICONS[name]?svgIcon(ICONS[name],cls):''; }

/* ---------- IndexedDB（图片/录音 + 冗余备份） ---------- */
const IDB = (()=>{
  let dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      if(!window.indexedDB){res(null);return;}
      const rq=indexedDB.open('baoStation',1);
      rq.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('assets')) db.createObjectStore('assets',{keyPath:'id'});
        if(!db.objectStoreNames.contains('backup')) db.createObjectStore('backup',{keyPath:'k'});
      };
      rq.onsuccess=e=>res(e.target.result);
      rq.onerror=()=>res(null);
    });
    return dbp;
  }
  async function tx(store,mode){
    const db=await open(); if(!db) return null;
    return db.transaction(store,mode).objectStore(store);
  }
  return {
    async put(id,blob,meta){
      const st=await tx('assets','readwrite'); if(!st) return false;
      return new Promise(r=>{const q=st.put(Object.assign({id,blob,ts:Date.now()},meta||{}));q.onsuccess=()=>r(true);q.onerror=()=>r(false);});
    },
    async get(id){
      const st=await tx('assets','readonly'); if(!st) return null;
      return new Promise(r=>{const q=st.get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});
    },
    async del(id){
      const st=await tx('assets','readwrite'); if(!st) return;
      st.delete(id);
    },
    async all(){
      const st=await tx('assets','readonly'); if(!st) return [];
      return new Promise(r=>{const q=st.getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});
    },
    async backup(data){
      const st=await tx('backup','readwrite'); if(!st) return;
      st.put({k:'main',data,ts:Date.now()});
    },
    async readBackup(){
      const st=await tx('backup','readonly'); if(!st) return null;
      return new Promise(r=>{const q=st.get('main');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});
    }
  };
})();

/* objectURL 缓存 */
const urlCache={};
async function assetURL(id){
  if(urlCache[id]) return urlCache[id];
  const a=await IDB.get(id);
  if(!a||!a.blob) return '';
  const u=URL.createObjectURL(a.blob);
  urlCache[id]=u; return u;
}
async function saveAsset(blob,meta){
  const id=uid();
  await IDB.put(id,blob,meta);
  return id;
}

/* ---------- 数据模型 ---------- */
const LS_KEY='baoStation.v1';
const DEFAULT_MODULES=[
  {id:'daily',name:'日常管理',icon:'chicken',on:true,children:[
    {id:'tasks',name:'每日任务',icon:'scroll',on:true},
    {id:'mood', name:'心情日历',icon:'tulip', on:true},
    {id:'memo', name:'备忘录',  icon:'book',  on:true}
  ]},
  {id:'growth',name:'成长提升',icon:'star',on:true,children:[
    {id:'sport',name:'运动锻炼',icon:'boot',on:true}
  ]},
  {id:'life',name:'生活专区',icon:'house',on:true,children:[
    {id:'food',  name:'美食',    icon:'egg',on:true},
    {id:'movie', name:'影视登记',icon:'tv', on:true}
  ]}
];
function blankDB(){
  return {
    v:1,
    cfg:{modules:JSON.parse(JSON.stringify(DEFAULT_MODULES)),collapsed:false,mapKey:'',haley:true,last:'tasks',folded:{}},
    tasks:{},        // {'2026-08-02':[{id,text,done,ts,doneAt}]}
    presets:['喝够 8 杯水','读书 30 分钟','早睡早起','整理房间'],
    mood:{},         // {'2026-08-02':'happy'}
    memos:[],        // {id,date,time,title,text,imgs[],auds[]}
    sports:[],       // {id,date,type,min,note}
    weights:[],      // {date,kg}
    foods:[],        // {id,date,name,place,imgs[],auds[],mood,note}
    movies:[]        // {id,title,type,date,rate,review,poster}
  };
}
let DB = blankDB();
let dirty=false, saveTimer=null;

function migrate(d){
  const b=blankDB();
  const out=Object.assign(b,d||{});
  out.cfg=Object.assign(b.cfg,d&&d.cfg||{});
  if(!Array.isArray(out.cfg.modules)||!out.cfg.modules.length) out.cfg.modules=b.cfg.modules;
  // 补齐后续版本新增的模块
  DEFAULT_MODULES.forEach(dm=>{
    let m=out.cfg.modules.find(x=>x.id===dm.id);
    if(!m){out.cfg.modules.push(JSON.parse(JSON.stringify(dm)));return;}
    if(!Array.isArray(m.children)) m.children=[];
    dm.children.forEach(dc=>{ if(!m.children.find(x=>x.id===dc.id)) m.children.push(Object.assign({},dc)); });
    m.children.forEach(c=>{ if(!c.icon){const s=dm.children.find(x=>x.id===c.id); c.icon=s?s.icon:'scroll';} });
    if(!m.icon) m.icon=dm.icon;
  });
  ['memos','sports','weights','foods','movies','presets'].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=b[k]; });
  if(!out.tasks||typeof out.tasks!=='object') out.tasks={};
  if(!out.mood||typeof out.mood!=='object') out.mood={};
  if(!out.cfg.folded||typeof out.cfg.folded!=='object') out.cfg.folded={};
  return out;
}
async function loadDB(){
  let raw=null;
  try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
  if(raw){
    try{ DB=migrate(JSON.parse(raw)); }
    catch(e){ DB=blankDB(); }
  }else{
    // localStorage 被清空 → 尝试从 IndexedDB 冗余备份恢复
    const bk=await IDB.readBackup();
    if(bk&&bk.data){
      try{ DB=migrate(JSON.parse(bk.data)); toast('已从本地缓存恢复数据 🌱',2600); }
      catch(e){ DB=blankDB(); }
    }
  }
}
function save(now){
  dirty=true;
  clearTimeout(saveTimer);
  const doSave=()=>{
    const s=JSON.stringify(DB);
    try{ localStorage.setItem(LS_KEY,s); dirty=false; }
    catch(e){ toast('本地空间不足，请在设置里清理图片',3200); }
    IDB.backup(s);
    syncMark();
  };
  if(now) doSave(); else saveTimer=setTimeout(doSave,220);
}
window.addEventListener('beforeunload',()=>{ if(dirty){ try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){} } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&dirty) save(true); });

/* 离线/在线状态标记（纯本地模式：网络恢复只做一次完整性回写） */
let pendingOffline=0;
function syncMark(){
  if(!navigator.onLine) pendingOffline++;
}
window.addEventListener('online',()=>{
  if(pendingOffline>0){ save(true); toast('网络已恢复，'+pendingOffline+' 项变更已固化 ✅',2400); pendingOffline=0; }
  const b=$('#netBadge'); if(b) b.textContent='在线';
});
window.addEventListener('offline',()=>{ const b=$('#netBadge'); if(b) b.textContent='离线'; toast('已离线，数据继续保存在本机 📦',2200); });
/* ==================================================================
   导航 / 路由 / 侧边栏
   ================================================================== */
let curPage='tasks';
const isMobile=()=>window.innerWidth<=820;

function renderNav(){
  const box=$('#navBox'); let h='';
  DB.cfg.modules.forEach(m=>{
    if(!m.on) return;
    const kids=(m.children||[]).filter(c=>c.on);
    if(!kids.length) return;
    const folded=DB.cfg.folded[m.id]?' folded':'';
    h+='<div class="l1'+folded+'" data-l1="'+m.id+'">';
    h+='<div class="l1-head" data-fold="'+m.id+'" title="'+esc(m.name)+'">'+ico(m.icon,'l1-ico')+
       '<span class="l1-name">'+esc(m.name)+'</span><span class="l1-arrow">▼</span></div>';
    h+='<div class="l1-line"></div><div class="l1-kids">';
    kids.forEach(c=>{
      h+='<div class="l2'+(c.id===curPage?' active':'')+'" data-go="'+c.id+'" title="'+esc(c.name)+'">'+
         ico(c.icon,'l2-ico')+'<span class="l2-name">'+esc(c.name)+'</span></div>';
    });
    h+='</div></div>';
  });
  if(!h) h='<div style="padding:14px;color:#ffe9b8;font-size:12px;text-align:center">模块都关掉啦<br>去设置里打开吧</div>';
  box.innerHTML=h;
  $$('[data-go]',box).forEach(el=>el.onclick=()=>go(el.dataset.go));
  $$('[data-fold]',box).forEach(el=>el.onclick=e=>{
    if(isMobile()&&false) return;
    const id=el.dataset.fold;
    DB.cfg.folded[id]=!DB.cfg.folded[id]; save(); renderNav();
  });
}
function findPage(id){
  for(const m of DB.cfg.modules){
    for(const c of (m.children||[])) if(c.id===id) return {l1:m,l2:c};
  }
  return null;
}
function firstPage(){
  for(const m of DB.cfg.modules){ if(!m.on) continue;
    for(const c of (m.children||[])) if(c.on) return c.id; }
  return null;
}
const RENDER={};
function go(id){
  const f=findPage(id);
  if(!f||!f.l1.on||!f.l2.on){ const fp=firstPage(); if(!fp){ $('#content').innerHTML='<div class="empty"><span class="big">🌾</span>所有模块都关闭了，点左下角「设置」打开吧</div>'; $('#cbL1').textContent='';$('#cbL2').textContent='空空如也'; return;} return go(fp); }
  curPage=id; DB.cfg.last=id; save();
  $('#cbL1').textContent=f.l1.name;
  $('#cbL2').textContent=f.l2.name;
  renderNav();
  $('#content').scrollTop=0;
  (RENDER[id]||(()=> $('#content').innerHTML='<div class="empty">建设中</div>'))();
  if(isMobile()) closeDrawer();
}

/* ---------- 图片压缩 ---------- */
function compressImage(file,maxW,quality){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const mw=maxW||1280;
        if(w>mw){ h=Math.round(h*mw/w); w=mw; }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(b=>res(b||file),'image/jpeg',quality||0.82);
      };
      img.onerror=()=>res(file);
      img.src=fr.result;
    };
    fr.onerror=()=>res(file);
    fr.readAsDataURL(file);
  });
}
async function pickImages(cb,maxW){
  const i=document.createElement('input');
  i.type='file'; i.accept='image/*'; i.multiple=true;
  i.onchange=async()=>{
    const files=Array.from(i.files||[]); if(!files.length) return;
    toast('图片处理中…',1200);
    const ids=[];
    for(const f of files){
      const blob=await compressImage(f,maxW,0.82);
      ids.push(await saveAsset(blob,{type:'image',name:f.name}));
    }
    cb(ids);
  };
  i.click();
}

/* ---------- 录音 ---------- */
const Rec={
  mr:null,chunks:[],t0:0,timer:null,
  supported(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder); },
  async start(onTick){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    let opt={};
    if(MediaRecorder.isTypeSupported('audio/webm')) opt={mimeType:'audio/webm'};
    else if(MediaRecorder.isTypeSupported('audio/mp4')) opt={mimeType:'audio/mp4'};
    this.mr=new MediaRecorder(stream,opt); this.chunks=[]; this.t0=Date.now();
    this.mr.ondataavailable=e=>{ if(e.data&&e.data.size) this.chunks.push(e.data); };
    this.mr.start();
    this.timer=setInterval(()=>onTick&&onTick(Math.floor((Date.now()-this.t0)/1000)),300);
    this._stream=stream;
  },
  stop(){
    return new Promise(res=>{
      if(!this.mr){res(null);return;}
      clearInterval(this.timer);
      this.mr.onstop=()=>{
        const type=this.mr.mimeType||'audio/webm';
        const blob=new Blob(this.chunks,{type});
        (this._stream.getTracks()||[]).forEach(t=>t.stop());
        this.mr=null;
        res({blob,sec:Math.floor((Date.now()-this.t0)/1000)});
      };
      try{ this.mr.stop(); }catch(e){ res(null); }
    });
  }
};
/* 通用录音条：宿主元素内渲染 */
function recorderUI(host,onDone){
  if(!Rec.supported()){
    host.innerHTML='<div class="muted">当前环境不支持录音（需 https 或 localhost 打开）</div>';
    return;
  }
  host.innerHTML='<div class="rec"><button class="btn sky sm" data-rs>🎙 开始录音</button><span class="muted" data-rt></span></div>';
  const btn=$('[data-rs]',host), tt=$('[data-rt]',host);
  let on=false;
  btn.onclick=async()=>{
    if(!on){
      try{
        await Rec.start(s=>tt.innerHTML='<span class="rec-dot" style="display:inline-block"></span> 录音中 '+pad(Math.floor(s/60))+':'+pad(s%60));
        on=true; btn.textContent='⏹ 停止'; btn.classList.remove('sky'); btn.classList.add('warn');
      }catch(e){ toast('麦克风权限被拒绝了 🎙',2400); }
    }else{
      const r=await Rec.stop(); on=false;
      btn.textContent='🎙 开始录音'; btn.classList.add('sky'); btn.classList.remove('warn'); tt.textContent='';
      if(r&&r.blob.size>0){
        const id=await saveAsset(r.blob,{type:'audio',sec:r.sec});
        onDone(id,r.sec);
      }
    }
  };
}

function todayTasks(){ const t=today(); if(!DB.tasks[t]) DB.tasks[t]=[]; return DB.tasks[t]; }
function doneCount(ds){ const a=DB.tasks[ds]||[]; return {d:a.filter(x=>x.done).length,t:a.length}; }

RENDER.tasks=function(){
  const t=today(), list=todayTasks();
  const c=doneCount(t);
  const pct=c.t?Math.round(c.d/c.t*100):0;
  let h='';
  h+='<div class="card">';
  h+='<div class="card-t">'+ico('scroll','ico')+'今天要做的事 <span class="muted" style="margin-left:auto;font-weight:600">'+dLabel(t)+'</span></div>';

  h+='<div style="flex:1;height:16px;background:var(--parch-3);border:2px solid var(--wood);border-radius:9px;overflow:hidden">'+
     '<div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#8fc94f,#f2b632);transition:width .35s"></div></div>';
  h+='<span class="chip">'+c.d+' / '+c.t+'</span></div>';
  h+='<div class="row" style="margin-bottom:10px"><input class="inp grow" id="tIn" placeholder="今天想完成点什么呢？回车添加" maxlength="60"><button class="btn pri" id="tAdd">＋ 添加</button></div>';
  if(DB.presets.length){
    h+='<div class="row" style="gap:6px;margin-bottom:4px"><span class="muted">常用：</span>'+
      DB.presets.map((p,i)=>'<button class="tagbtn" data-pre="'+i+'">'+esc(p)+'</button>').join('')+
      '<button class="btn mini" id="preEdit">编辑常用</button></div>';
  }else{
    h+='<div class="row"><button class="btn mini" id="preEdit">＋ 设置常用任务</button></div>';
  }
  h+='<div class="divider"></div><div id="tList">';
  if(!list.length) h+='<div class="empty"><span class="big">🌱</span>今天还是一片空地，种点什么吧</div>';
  else list.forEach(it=>{
    h+='<div class="task'+(it.done?' done':'')+'">'+
       '<button class="cb'+(it.done?' on':'')+'" data-tg="'+it.id+'">'+CHECK+'</button>'+
       '<span class="task-txt">'+esc(it.text)+'</span>'+
       (it.done&&it.doneAt?'<span class="muted" style="flex:0 0 auto">'+it.doneAt+'</span>':'')+
       '<button class="del" data-dl="'+it.id+'">×</button></div>';
  });
  h+='</div></div>';

  /* 历史 */
  const days=Object.keys(DB.tasks).filter(d=>d!==t&&(DB.tasks[d]||[]).length).sort().reverse();
  h+='<div class="card"><div class="card-t">'+ico('chest','ico')+'历史记录 <span class="muted" style="margin-left:auto;font-weight:600">共 '+days.length+' 天</span></div>';
  if(!days.length) h+='<div class="empty">还没有历史，明天再来看看 🌾</div>';
  else days.forEach(d=>{
    const cc=doneCount(d);
    h+='<div class="fold" data-fd><div class="fold-h">📅 '+dLabel(d)+
       '<span class="chip" style="margin-left:6px">'+cc.d+'/'+cc.t+'</span>'+
       (cc.t&&cc.d===cc.t?'<span class="chip" style="background:#dff0c8;border-color:var(--green)">全部完成 ✦</span>':'')+
       '<span class="ar">▶</span></div><div class="fold-b">'+
       DB.tasks[d].map(it=>'<div class="task'+(it.done?' done':'')+'" style="margin-bottom:5px">'+
         '<span style="width:20px;text-align:center">'+(it.done?'✅':'⬜')+'</span>'+
         '<span class="task-txt">'+esc(it.text)+'</span>'+
         '<button class="del" data-hdl="'+d+'|'+it.id+'">×</button></div>').join('')+
       '</div></div>';
  });
  h+='</div>';
  $('#content').innerHTML=h+decoHTML();

  const add=()=>{
    const v=$('#tIn').value.trim(); if(!v) return;
    todayTasks().push({id:uid(),text:v,done:false,ts:Date.now()});
    save(); RENDER.tasks(); $('#tIn').focus();
  };
  $('#tAdd').onclick=add;
  $('#tIn').onkeydown=e=>{ if(e.key==='Enter') add(); };
  $$('[data-pre]').forEach(b=>b.onclick=()=>{
    const p=DB.presets[+b.dataset.pre];
    if(todayTasks().some(x=>x.text===p)){toast('这条已经在列表里啦');return;}
    todayTasks().push({id:uid(),text:p,done:false,ts:Date.now()});
    save(); RENDER.tasks();
  });
  $('#preEdit').onclick=editPresets;
  $$('[data-tg]').forEach(b=>b.onclick=()=>{
    const it=todayTasks().find(x=>x.id===b.dataset.tg); if(!it) return;
    it.done=!it.done; it.doneAt=it.done?nowT():'';
    save(); RENDER.tasks();
    if(it.done) checkAllDone();
  });
  $$('[data-dl]').forEach(b=>b.onclick=()=>{
    DB.tasks[today()]=todayTasks().filter(x=>x.id!==b.dataset.dl);
    save(); RENDER.tasks();
  });
  $$('[data-hdl]').forEach(b=>b.onclick=()=>{
    const [d,id]=b.dataset.hdl.split('|');
    DB.tasks[d]=(DB.tasks[d]||[]).filter(x=>x.id!==id);
    if(!DB.tasks[d].length) delete DB.tasks[d];
    save(); RENDER.tasks();
  });
  bindFolds();
};

function moodImg(k,size){
  const m=MOODS[k]; if(!m) return '';
  return '<img src="'+m.img+'" alt="'+m.label+'" style="width:'+size+'px;height:auto;display:block;image-rendering:pixelated" title="'+m.tip+'">';
}
let calCur=null;
RENDER.mood=function(){
  const t=today();
  if(!calCur){ const d=new Date(); calCur={y:d.getFullYear(),m:d.getMonth()}; }
  const y=calCur.y,mo=calCur.m;
  const first=new Date(y,mo,1), start=first.getDay(), days=new Date(y,mo+1,0).getDate();
  let h='';
  h+='<div class="card"><div class="card-t">'+ico('tulip','ico')+'心情日历'+
     '<span style="margin-left:auto;display:flex;align-items:center;gap:7px">'+
     '<button class="btn mini" id="mPrev">‹</button><b style="font-size:14px">'+y+' 年 '+(mo+1)+' 月</b><button class="btn mini" id="mNext">›</button>'+
     '<button class="btn mini" id="mToday">回到本月</button></span></div>';
  /* 选择今日心情 */
  h+='<div class="px-in" style="padding:10px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:8px">今天（'+dLabel(t)+'）心情是——</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-items:center;max-width:294px;margin:0 auto">';
  Object.keys(MOODS).forEach(k=>{
    const on=DB.mood[t]===k;
    h+='<div data-md="'+k+'" style="cursor:pointer;text-align:center;padding:5px 7px;border:2px solid '+(on?'var(--gold)':'var(--wood-light)')+
       ';border-radius:5px;background:'+(on?'#fff3d4':'#fffdf5')+';box-shadow:0 1px 0 rgba(92,58,30,.22)">'+
       '<div style="width:56px;height:56px;margin:0 auto 2px">'+moodImg(k,56)+'</div>'+
       '<div style="font-size:11px;font-weight:700">'+MOODS[k].emo+' '+MOODS[k].label+'</div></div>';
  });
  h+='</div></div>';
  /* 月历 */
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
  WK.forEach(w=>h+='<div style="text-align:center;font-size:11.5px;font-weight:800;color:var(--ink-soft);padding:3px 0">'+w+'</div>');
  for(let i=0;i<start;i++) h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+pad(mo+1)+'-'+pad(d);
    const mk=DB.mood[ds], cc=doneCount(ds), isT=ds===t;
    h+='<div data-day="'+ds+'" style="cursor:pointer;min-height:50px;border:2px solid '+(isT?'var(--gold)':'var(--wood-light)')+
       ';border-radius:5px;background:'+(isT?'#fff6dd':'#fffdf5')+';padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative">'+
       '<div style="font-size:10.5px;font-weight:800;color:'+(isT?'var(--red)':'var(--ink-soft)')+'">'+d+'</div>'+
       (mk?'<div style="width:32px;height:32px">'+moodImg(mk,32)+'</div>':'<div style="width:32px;height:32px;opacity:.16;display:flex;align-items:center;justify-content:center;font-size:18px">✿</div>')+
       (cc.t?'<div style="font-size:9.5px;font-weight:700;color:'+(cc.d===cc.t?'var(--green-dark)':'var(--ink-soft)')+'">'+cc.d+'/'+cc.t+'</div>':'')+
       '</div>';
  }
  h+='</div>';
  const monthMoods={};
  for(let d=1;d<=days;d++){const ds=y+'-'+pad(mo+1)+'-'+pad(d);if(DB.mood[ds])monthMoods[DB.mood[ds]]=(monthMoods[DB.mood[ds]]||0)+1;}
  h+='<div class="divider"></div><div class="row" style="gap:9px"><span class="muted">本月统计：</span>'+

const SPORTS=[
  {n:'跑步',e:'🏃'},{n:'快走',e:'🚶'},{n:'骑行',e:'🚲'},{n:'游泳',e:'🏊'},
  {n:'瑜伽',e:'🧘'},{n:'健身房',e:'🏋'},{n:'跳绳',e:'🪢'},{n:'羽毛球',e:'🏸'},
  {n:'篮球',e:'🏀'},{n:'爬山',e:'⛰'},{n:'跳舞',e:'💃'},{n:'拉伸',e:'🤸'},
  {n:'打扫',e:'🧹'},{n:'散步',e:'🌳'}
];
function lineChart(data,opt){
  opt=opt||{};
  if(data.length<1) return '<div class="empty">还没有数据，记录两次以上就会出现曲线啦 📈</div>';
  const W=Math.max(340,Math.min(760,data.length*56+80)),H=opt.h||210,PL=44,PR=16,PT=16,PB=34;
  const vals=data.map(d=>d.v);
  let mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mx-mn<1){mn-=1;mx+=1;}
  const padv=(mx-mn)*0.18; mn-=padv; mx+=padv;
  const X=i=>PL+(data.length===1?(W-PL-PR)/2:i*(W-PL-PR)/(data.length-1));
  const Y=v=>PT+(mx-v)/(mx-mn)*(H-PT-PB);
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,340)+'px;height:'+H+'px">';
  g+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fffdf5" rx="4"/>';
  for(let i=0;i<=4;i++){
    const y=PT+i*(H-PT-PB)/4, v=(mx-(mx-mn)*i/4);
    g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#ecd6ac" stroke-width="1" stroke-dasharray="4 4"/>';
    g+='<text x="'+(PL-6)+'" y="'+(y+4)+'" font-size="10.5" fill="#7a5a3a" text-anchor="end" font-family="Microsoft YaHei">'+v.toFixed(1)+'</text>';
  }
  if(data.length>1){
    let area='M '+X(0)+' '+(H-PB);
    data.forEach((d,i)=>area+=' L '+X(i)+' '+Y(d.v));
    area+=' L '+X(data.length-1)+' '+(H-PB)+' Z';
    g+='<path d="'+area+'" fill="rgba(124,179,66,.18)"/>';
    let ln='';
    data.forEach((d,i)=>ln+=(i?' L ':'M ')+X(i)+' '+Y(d.v));
    g+='<path d="'+ln+'" fill="none" stroke="#6ba336" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  data.forEach((d,i)=>{
    g+='<rect x="'+(X(i)-4)+'" y="'+(Y(d.v)-4)+'" width="8" height="8" fill="#f2b632" stroke="#5c3a1e" stroke-width="2"/>';
    g+='<text x="'+X(i)+'" y="'+(Y(d.v)-11)+'" font-size="10.5" fill="#4a2f18" text-anchor="middle" font-weight="bold" font-family="Microsoft YaHei">'+d.v+'</text>';
    if(data.length<=14||i%Math.ceil(data.length/10)===0)
      g+='<text x="'+X(i)+'" y="'+(H-12)+'" font-size="10" fill="#7a5a3a" text-anchor="middle" font-family="Microsoft YaHei">'+d.l+'</text>';
  });
  g+='</svg>';
  return g;
}

    '<textarea class="ta" id="fX" placeholder="当时的心情、味道、和谁一起吃的…" style="min-height:70px;margin-top:8px">'+esc(d.note)+'</textarea>'+
    '<div class="divider"></div><div style="font-weight:700;margin-bottom:6px">🎙 说说当时的心情</div><div id="fRec"></div><div class="audios" id="fAu"></div>'+
    '<div class="foot"><button class="btn" id="fC">取消</button><button class="btn pri" id="fS">保存</button></div>',
  mo=>{
    const refresh=()=>{
      renderThumbs($('#fTh',mo),d.imgs,id=>{d.imgs=d.imgs.filter(x=>x!==id);IDB.del(id);refresh();});
      renderAudios($('#fAu',mo),d.auds,id=>{d.auds=d.auds.filter(x=>x!==id);IDB.del(id);refresh();});
      $('#fPn',mo).textContent=d.imgs.length?d.imgs.length+' 张':'';
    };
    refresh();
    recorderUI($('#fRec',mo),id=>{d.auds.push(id);refresh();toast('录音已保存 🎧');});
    $$('[data-fm]',mo).forEach(b=>b.onclick=()=>{
      d.mood=(d.mood===b.dataset.fm)?'':b.dataset.fm;
      $$('[data-fm]',mo).forEach(x=>x.classList.toggle('on',x.dataset.fm===d.mood));
    });
    $('#fPic',mo).onclick=()=>pickImages(ids=>{d.imgs=d.imgs.concat(ids);refresh();},1280);
    $('#fC',mo).onclick=closeModal;
    $('#fS',mo).onclick=()=>{
      d.name=$('#fN',mo).value.trim()||'未命名美食';
      d.place=$('#fP',mo).value.trim(); d.note=$('#fX',mo).value; d.date=$('#fD',mo).value||today();
      if(isNew) DB.foods.push(d); else DB.foods[DB.foods.findIndex(x=>x.id===d.id)]=d;
      save(); closeModal(); RENDER.food(); toast('已保存 ✅');
    };
  });
}

   ⑥ 影视登记
   ================================================================== */
const MV_TYPE=['电影','剧集','动画','纪录片','综艺'];
function stars(n,editable){
  let s='';
  for(let i=1;i<=5;i++) s+='<span '+(editable?'data-st="'+i+'" style="cursor:pointer;"':'')+' style="font-size:16px;color:'+(i<=n?'#f2b632':'#d8c7a6')+'">★</span>';
  return s;
}
RENDER.movie=function(){
  let h='<div class="card"><div class="card-t">'+ico('tv','ico')+'影视登记'+
    '<span class="chip" style="margin-left:auto">共 '+DB.movies.length+' 部</span>'+
    '<button class="btn pri" id="vAdd">＋ 登记</button></div>';
  const cnt={}; DB.movies.forEach(m=>cnt[m.type]=(cnt[m.type]||0)+1);
  h+='<div class="row" style="gap:6px">'+MV_TYPE.map(t=>'<span class="chip">'+t+' '+(cnt[t]||0)+'</span>').join('')+'</div></div>';
  if(!DB.movies.length) h+='<div class="card"><div class="empty"><span class="big">🎬</span>还没有看过的片子，去登记一部吧</div></div>';
  else{
    h+='<div class="grid g3">';
    DB.movies.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(m=>{
      h+='<div class="card" style="margin:0;padding:0;overflow:hidden">';
      h+='<div style="width:100%;aspect-ratio:2/3;background:linear-gradient(160deg,#d9c39a,#c2a77c);display:flex;align-items:center;justify-content:center;position:relative" data-vp="'+m.id+'">'+
         (m.poster?'<img data-vi="'+m.id+'" style="width:100%;height:100%;object-fit:cover;cursor:zoom-in" alt="">':'<span style="font-size:34px;opacity:.55">🎞</span>')+
         '<span style="position:absolute;left:0;bottom:0;background:rgba(60,36,16,.78);color:#fff6e0;font-size:10.5px;padding:2px 6px;border-radius:0 4px 0 0">'+esc(m.type||'影视')+'</span></div>';
      h+='<div style="padding:8px 9px"><b style="font-size:13.5px;display:block;line-height:1.35">'+esc(m.title)+'</b>'+
         '<div style="margin:3px 0">'+stars(m.rate)+'</div>'+
         '<div class="muted">'+esc(m.date)+'</div>'+
         (m.review?'<div style="font-size:12px;margin-top:5px;white-space:pre-wrap;max-height:74px;overflow:auto">'+esc(m.review)+'</div>':'')+
         '<div class="row" style="margin-top:7px;gap:5px"><button class="btn mini" data-ve="'+m.id+'">编辑</button><button class="del" data-vx="'+m.id+'">×</button></div>';
      h+='</div></div>';
    });
    h+='</div>';
  }
  $('#content').innerHTML=h+decoHTML();
  $('#vAdd').onclick=()=>movieEdit(null);
  DB.movies.forEach(async m=>{
    if(!m.poster) return;
    const el=$('[data-vi="'+m.id+'"]'); if(!el) return;
    const u=await assetURL(m.poster); if(u){ el.src=u; el.onclick=()=>lightbox(u); }
  });
  $$('[data-ve]').forEach(b=>b.onclick=()=>movieEdit(DB.movies.find(x=>x.id===b.dataset.ve)));
  $$('[data-vx]').forEach(b=>b.onclick=()=>{
    const m=DB.movies.find(x=>x.id===b.dataset.vx);
    confirmBox('删除登记','确定删除「'+esc(m.title)+'」？',()=>{
      if(m.poster) IDB.del(m.poster);
      DB.movies=DB.movies.filter(x=>x.id!==b.dataset.vx); save(); RENDER.movie(); toast('已删除');
    });
  });
};
function movieEdit(m){
  const isNew=!m;
  const d=m?JSON.parse(JSON.stringify(m)):{id:uid(),title:'',type:'电影',date:today(),rate:0,review:'',poster:''};
  modal('<h3>🎬 '+(isNew?'登记影视':'编辑登记')+'</h3>'+
    '<div class="row" style="margin-bottom:8px"><input class="inp grow" id="vT" placeholder="片名" value="'+esc(d.title)+'" maxlength="40">'+
    '<input class="inp" id="vD" type="date" value="'+d.date+'" style="width:150px"></div>'+
    '<div class="row" style="gap:6px;margin-bottom:8px">'+MV_TYPE.map(t=>'<button class="tagbtn'+(d.type===t?' on':'')+'" data-vt="'+t+'">'+t+'</button>').join('')+'</div>'+
    '<div class="row" style="margin-bottom:8px"><span style="font-weight:700">评分：</span><span id="vSt">'+stars(d.rate,true)+'</span></div>'+
    '<div class="row" style="margin-bottom:6px"><button class="btn sm" id="vPic">🖼 上传海报</button><button class="btn sm" id="vPd" style="display:'+(d.poster?'inline-block':'none')+'">移除海报</button></div>'+
    '<div class="thumbs" id="vTh"></div>'+
    '<textarea class="ta" id="vR" placeholder="看完想说点什么…" style="min-height:90px;margin-top:8px">'+esc(d.review)+'</textarea>'+
    '<div class="foot"><button class="btn" id="vC">取消</button><button class="btn pri" id="vS">保存</button></div>',
  mo=>{
    const refresh=()=>{
      renderThumbs($('#vTh',mo),d.poster?[d.poster]:[]);
      $('#vPd',mo).style.display=d.poster?'inline-block':'none';
      $('#vSt',mo).innerHTML=stars(d.rate,true); bindStars();
    };
    const bindStars=()=>$$('[data-st]',mo).forEach(s=>s.onclick=()=>{ d.rate=(d.rate===+s.dataset.st)?0:+s.dataset.st; refresh(); });
    refresh();
    $$('[data-vt]',mo).forEach(b=>b.onclick=()=>{ d.type=b.dataset.vt; $$('[data-vt]',mo).forEach(x=>x.classList.toggle('on',x.dataset.vt===d.type)); });
    $('#vPic',mo).onclick=()=>pickImages(ids=>{ if(d.poster) IDB.del(d.poster); d.poster=ids[0]; ids.slice(1).forEach(i=>IDB.del(i)); refresh(); },720);
    $('#vPd',mo).onclick=()=>{ if(d.poster) IDB.del(d.poster); d.poster=''; refresh(); };
    $('#vC',mo).onclick=closeModal;
    $('#vS',mo).onclick=()=>{
      d.title=$('#vT',mo).value.trim(); d.date=$('#vD',mo).value||today(); d.review=$('#vR',mo).value;
      if(!d.title){toast('片名总得写一个吧 🎬');return;}
      if(isNew) DB.movies.push(d); else DB.movies[DB.movies.findIndex(x=>x.id===d.id)]=d;
      save(); closeModal(); RENDER.movie(); toast('已保存 ✅');
    };
  });
}

function haleySay(text,ms){
  if(!DB.cfg.haley) return;
  const b=$('#bubble');
  b.innerHTML='<span class="nm">海莉</span>'+esc(text);
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>b.classList.remove('show'),ms||4600);
}
function haleyClick(){
  const t=today(), a=DB.tasks[t]||[];
  const left=a.filter(x=>!x.done).length;
  let txt;
  if(!a.length) txt=SAY_ZERO[Math.floor(Math.random()*SAY_ZERO.length)];
  else if(left===0) txt=SAY_ALLDONE[Math.floor(Math.random()*SAY_ALLDONE.length)];
  else if(Math.random()<0.55) txt=SAY_HALF[Math.floor(Math.random()*SAY_HALF.length)].replace('%n',left);
  else txt=SAY_IDLE[Math.floor(Math.random()*SAY_IDLE.length)];
  haleySay(txt);
}
let lastAllDone=false;
function checkAllDone(){
  const a=DB.tasks[today()]||[];
  if(!a.length) return;
  const all=a.every(x=>x.done);
  if(all&&!lastAllDone){
    lastAllDone=true;
    haleySay(SAY_ALLDONE[Math.floor(Math.random()*SAY_ALLDONE.length)],8000);
    confetti();
  }
  if(!all) lastAllDone=false;
}
function confetti(){
  const cols=['#f2b632','#d1533f','#7cb342','#62b6e8','#e0798f','#fff6e0'];
  const box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:180;overflow:hidden';
  for(let i=0;i<46;i++){
    const p=document.createElement('div');
    const sz=4+Math.floor(Math.random()*6);
    p.style.cssText='position:absolute;top:-14px;left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;background:'+
      cols[i%cols.length]+';opacity:.95;animation:fall '+(1.9+Math.random()*1.6)+'s linear '+(Math.random()*0.7)+'s forwards';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),4200);
}
(function(){
  const st=document.createElement('style');
  st.textContent='@keyframes fall{to{transform:translateY(104vh) rotate(520deg);opacity:.15}}';
  document.head.appendChild(st);
})();
function initHaley(){
  const el=$('#haley');
  const img=$('.body',el);
  img.src=HALEY_IMG;
  el.style.display=DB.cfg.haley?'block':'none';
  if(DB.cfg.hpos){ el.style.left=DB.cfg.hpos.x+'px'; el.style.top=DB.cfg.hpos.y+'px'; el.style.right='auto'; el.style.bottom='auto'; }
  let drag=false,moved=false,sx=0,sy=0,ox=0,oy=0;
  const down=e=>{
    if(e.target.closest('#bubble')) return;
    drag=true;moved=false;el.classList.add('drag');
    const p=e.touches?e.touches[0]:e;
    const r=el.getBoundingClientRect();
    sx=p.clientX;sy=p.clientY;ox=r.left;oy=r.top;
    el.setPointerCapture&&e.pointerId!=null&&el.setPointerCapture(e.pointerId);
  };
  const move=e=>{
    if(!drag) return;
    const p=e.touches?e.touches[0]:e;
    const dx=p.clientX-sx,dy=p.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true;
    let nx=Math.max(2,Math.min(window.innerWidth-el.offsetWidth-2,ox+dx));
    let ny=Math.max(2,Math.min(window.innerHeight-el.offsetHeight-2,oy+dy));
    el.style.left=nx+'px';el.style.top=ny+'px';el.style.right='auto';el.style.bottom='auto';
    e.preventDefault();
  };
  const up=()=>{
    if(!drag) return;
    drag=false;el.classList.remove('drag');
    const r=el.getBoundingClientRect();
    DB.cfg.hpos={x:Math.round(r.left),y:Math.round(r.top)}; save();
    if(!moved) haleyClick();
  };
  el.addEventListener('pointerdown',down);
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',up);
  el.addEventListener('touchstart',down,{passive:true});
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('touchend',up);
  setTimeout(()=>{
    const h=new Date().getHours();
    const g=h<6?'这么早…你不睡觉的吗？':h<11?'早上好。别赖床了，太阳都晒屁股了。':
            h<14?'吃午饭了吗？别老是吃泡面。':h<18?'下午了，效率怎么样？':
            h<22?'晚上好~今天过得还行吧？':'很晚了哦，早点睡，皮肤会变差的。';
    haleySay(g,5200);
  },900);
}

   ⑨ 页面装饰（不遮挡内容，仅底部/角落）

const DECO=['🌻','🍓','🎃','🥚','🌱','🍄','⭐','🌼','🐔','🧺'];

/* ==================================================================
   ⑩ 设置
   ================================================================== */
window.openSetting=function(tab){
  closeModal();
  const T=tab||'modules';
  let h='<h3>'+ico('gear','ico')+' 设置</h3>';
  h+='<div class="row" style="gap:6px;margin-bottom:11px">'+
     [['modules','模块管理'],['data','数据备份'],['about','关于']]
     .map(x=>'<button class="tagbtn'+(T===x[0]?' on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  h+='<div id="stBody"></div><div class="foot"><button class="btn pri" id="stC">完成</button></div>';
  modal(h,m=>{
    $('#stC',m).onclick=()=>{ closeModal(); renderNav(); go(curPage); };
    $$('[data-tab]',m).forEach(b=>b.onclick=()=>openSetting(b.dataset.tab));
    stRender(T);
  });
};
function stRender(tab){
  const box=$('#stBody'); if(!box) return;
  if(tab==='modules'){
    let h='<div class="muted" style="margin-bottom:9px">名称可随时改，开关控制是否在侧边栏显示。一级模块字号略小于二级，这是刻意的排版。</div>';
    DB.cfg.modules.forEach(m=>{
      h+='<div class="px-in" style="padding:9px;margin-bottom:9px">';
      h+='<div class="row" style="margin-bottom:7px">'+ico(m.icon,'l1-ico')+
         '<input class="inp grow" data-mn="'+m.id+'" value="'+esc(m.name)+'" maxlength="10" style="font-weight:800">'+
         '<label class="row" style="gap:4px;flex:0 0 auto;cursor:pointer"><input type="checkbox" data-mo="'+m.id+'"'+(m.on?' checked':'')+' style="width:17px;height:17px"><span style="font-size:12px;font-weight:700">显示</span></label></div>';
      (m.children||[]).forEach(c=>{
        h+='<div class="row" style="margin:5px 0 0 16px">'+ico(c.icon,'l2-ico')+
           '<input class="inp grow" data-cn="'+m.id+'|'+c.id+'" value="'+esc(c.name)+'" maxlength="10">'+
           '<label class="row" style="gap:4px;flex:0 0 auto;cursor:pointer"><input type="checkbox" data-co="'+m.id+'|'+c.id+'"'+(c.on?' checked':'')+' style="width:17px;height:17px"><span style="font-size:12px;font-weight:700">显示</span></label></div>';
      });
      h+='</div>';
    });
    h+='<div class="divider"></div><label class="row" style="gap:7px;cursor:pointer"><input type="checkbox" id="stHaley"'+(DB.cfg.haley?' checked':'')+' style="width:18px;height:18px"><b>显示海莉桌面伙伴</b></label>';
    h+='<div class="row" style="margin-top:10px"><button class="btn" id="stReset">恢复默认模块名</button></div>';
    box.innerHTML=h;
    $$('[data-mn]',box).forEach(i=>i.oninput=()=>{ const m=DB.cfg.modules.find(x=>x.id===i.dataset.mn); m.name=i.value||m.name; save(); renderNav(); });
    $$('[data-mo]',box).forEach(i=>i.onchange=()=>{ DB.cfg.modules.find(x=>x.id===i.dataset.mo).on=i.checked; save(); renderNav(); });
    $$('[data-cn]',box).forEach(i=>i.oninput=()=>{ const [a,b]=i.dataset.cn.split('|'); const c=DB.cfg.modules.find(x=>x.id===a).children.find(x=>x.id===b); c.name=i.value||c.name; save(); renderNav(); });
    $$('[data-co]',box).forEach(i=>i.onchange=()=>{ const [a,b]=i.dataset.co.split('|'); DB.cfg.modules.find(x=>x.id===a).children.find(x=>x.id===b).on=i.checked; save(); renderNav(); });
    $('#stHaley',box).onchange=e=>{ DB.cfg.haley=e.target.checked; save(); $('#haley').style.display=DB.cfg.haley?'block':'none'; };
    $('#stReset',box).onclick=()=>{
      DEFAULT_MODULES.forEach(d=>{ const m=DB.cfg.modules.find(x=>x.id===d.id); if(!m)return; m.name=d.name;
        d.children.forEach(dc=>{ const c=m.children.find(x=>x.id===dc.id); if(c) c.name=dc.name; }); });
      save(); renderNav(); stRender('modules'); toast('已恢复默认名称');
    };
  }
  else if(tab==='data'){
    box.innerHTML='<div id="stStat" class="px-in" style="padding:10px;margin-bottom:10px">统计中…</div>'+
      '<div class="row" style="gap:7px">'+
      '<button class="btn pri" id="dxFull">💾 导出完整备份</button>'+
      '<button class="btn" id="dxText">📄 仅导出文字数据</button>'+
      '<button class="btn sky" id="dxIn">📥 导入备份</button></div>'+
      '<div class="muted" style="margin:9px 0 0;line-height:1.75">'+
      '完整备份包含图片和录音，文件较大但换手机/换电脑直接还原。<br>'+
      '建议每个月导出一次放到网盘，比任何自动同步都靠谱。</div>'+
      '<div class="divider"></div>'+
      '<button class="btn warn" id="dxClear">🗑 清空全部数据</button>';
    (async()=>{
      let ls=0; try{ ls=(localStorage.getItem(LS_KEY)||'').length*2; }catch(e){}
      const as=await IDB.all();
      const bytes=as.reduce((a,b)=>a+((b.blob&&b.blob.size)||0),0);
      const imgs=as.filter(a=>a.type==='image').length, auds=as.filter(a=>a.type==='audio').length;
      const st=$('#stStat'); if(st) st.innerHTML=
        '<div style="font-weight:800;margin-bottom:5px">📦 本机存储</div>'+
        '<div class="row" style="gap:7px"><span class="chip">文字数据 '+fmtSize(ls)+'</span>'+
        '<span class="chip">图片 '+imgs+' 张</span><span class="chip">录音 '+auds+' 段</span>'+
        '<span class="chip">附件合计 '+fmtSize(bytes)+'</span>'+
        '<span class="chip" id="netBadge">'+(navigator.onLine?'在线':'离线')+'</span></div>';
    })();
    $('#dxText',box).onclick=()=>downloadJSON({type:'bao-text',v:1,ts:Date.now(),db:DB},'宝工作台-文字备份-'+today()+'.json');
    $('#dxFull',box).onclick=async()=>{
      toast('打包中，请稍候…',3000);
      const as=await IDB.all(); const assets=[];
      for(const a of as){
        const b64=await blobToB64(a.blob);
        assets.push({id:a.id,type:a.type||'',name:a.name||'',sec:a.sec||0,data:b64});
      }
      downloadJSON({type:'bao-full',v:1,ts:Date.now(),db:DB,assets},'宝工作台-完整备份-'+today()+'.json');
    };
    $('#dxIn',box).onclick=()=>{
      const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
      i.onchange=()=>{
        const f=i.files[0]; if(!f) return;
        const fr=new FileReader();
        fr.onload=async()=>{
          try{
            const j=JSON.parse(fr.result);
            if(!j.db) throw 0;
            confirmBox('导入备份','导入会<b>覆盖当前所有数据</b>，确定继续吗？',async()=>{
              DB=migrate(j.db);
              if(Array.isArray(j.assets)){
                toast('还原附件中…',3000);
                for(const a of j.assets){ const blob=b64ToBlob(a.data); if(blob) await IDB.put(a.id,blob,{type:a.type,name:a.name,sec:a.sec}); }
              }
              save(true); toast('导入完成 ✅'); setTimeout(()=>location.reload(),900);
            });
          }catch(e){ toast('文件格式不对，导入失败'); }
        };
        fr.readAsText(f);
      };
      i.click();
    };
    $('#dxClear',box).onclick=()=>confirmBox('清空全部数据',
      '<b style="color:#c9432f">⚠️ 这个操作不可撤销！</b><br>所有任务、心情、备忘、图片、录音、足迹都会被删除。<br>建议先导出一份完整备份。',
      ()=>{
        confirmBox('再确认一次','真的要清空吗？最后一次机会。',async()=>{
          try{ localStorage.removeItem(LS_KEY); }catch(e){}
          const as=await IDB.all(); for(const a of as) await IDB.del(a.id);
          await IDB.backup('');
          location.reload();
        });
      });
  }
  else{
    box.innerHTML='<div style="line-height:1.9;font-size:13.5px">'+
      '<div style="text-align:center;font-size:26px;margin-bottom:6px">🌾</div>'+
      '<b>۶•͈⚇•͈ა宝工作台</b> · 单文件离线版<br>'+
      '<span class="muted">一个 HTML 文件，不依赖任何服务器</span>'+
      '<div class="divider"></div>'+
      '<b>📱 iPhone 添加到主屏幕</b><br>Safari 打开 → 底部分享 <b>􀈂</b> → 「添加到主屏幕」→ 全屏运行，和 App 一样<br><br>'+
      '<b>💻 电脑桌面图标</b><br>双击项目里的 <b>创建桌面快捷方式.bat</b>，桌面会出现图标，双击即开<br><br>'+
      '<b>🔒 数据在哪</b><br>全部保存在你当前这台设备的浏览器里（localStorage + IndexedDB），不上传任何服务器。<br>'+
      '<span class="muted">注意：换设备、换浏览器、清除浏览器数据都会导致数据不互通，请用「数据备份」页导出。</span>'+
      '<div class="divider"></div>'+
      '<span class="muted">地图服务：腾讯位置服务　·　像素素材：手绘 SVG</span></div>';
  }
}
function downloadJSON(obj,name){
  const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1200);
  toast('已导出到「下载」文件夹 💾',2600);
}
function blobToB64(blob){
  return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.onerror=()=>r(''); f.readAsDataURL(blob); });
}
function b64ToBlob(d){
  try{
    const [head,body]=d.split(',');
    const mime=(head.match(/:(.*?);/)||[])[1]||'application/octet-stream';
    const bin=atob(body); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){ return null; }
}

  const d=new Date();
  $('#topDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+WK[d.getDay()];
}
async function boot(){
  await loadDB();
  $('#sidebar .sb-logo').innerHTML=drawPx(ICONS.chicken.rows,P);
  if(DB.cfg.collapsed&&!isMobile()){ $('#sidebar').classList.add('collapsed'); $('#sbfold').innerHTML='<i>»</i><span>展开</span>'; }
  tickDate(); setInterval(tickDate,30000);
  renderNav();
  go(DB.cfg.last&&findPage(DB.cfg.last)?DB.cfg.last:(firstPage()||'tasks'));
  initHaley();
  const a=DB.tasks[today()]||[];
  lastAllDone=a.length>0&&a.every(x=>x.done);
  /* 跨天自动刷新 */
  let curDay=today();
  setInterval(()=>{ if(today()!==curDay){ curDay=today(); lastAllDone=false; go(curPage); toast('新的一天开始啦 🌅'); } },60000);
  /* iOS 主屏幕模式下阻止双指缩放导致的错位 */
  document.addEventListener('gesturestart',e=>e.preventDefault());
  window.addEventListener('resize',()=>{ if(!isMobile()) closeDrawer(); });
}
boot();

if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
